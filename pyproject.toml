[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kb"
version = "0.1.0"
description = "Multi-tenant knowledge base: Phase 1 application and database foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "SQLAlchemy>=2.0.36,<3",
    # Keep FastAPI's TestClient compatible with the HTTPX 0.x test dependency.
    "starlette>=0.46,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
